[project]
name = "expcon"
version = "0.1.0"
description = "Experiment Control System for AI-assisted ML research"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Expcon" }]
dependencies = [
    "click>=8.1",
    "jsonschema>=4.0",
    "pyyaml>=6.0",
    "tabulate>=0.9",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
tinker = ["tinker>=0.24; python_version >= '3.11'"]

[project.scripts]
expcon = "expcon.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.9",
    "mypy>=1.15",
    "types-PyYAML>=6",
    "types-jsonschema>=4",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
expcon = [
    "resources/skills/experiment-contract/SKILL.md",
    "resources/skills/experiment-contract/references/*.md",
    "resources/schemas/*.json",
    "resources/templates/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
check_untyped_defs = true

# Keep quality checks independent of a developer's parent-directory config.
[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
