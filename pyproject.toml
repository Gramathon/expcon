[project]
name = "expcon"
version = "0.1.0"
description = "Experiment Control System for AI-assisted ML research"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Expcon" }]
dependencies = [
    "click>=8.1",
    "jsonschema>=4.0",
    "pyyaml>=6.0",
    "tabulate>=0.9",
]

[project.scripts]
expcon = "expcon.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
expcon = [
    "resources/skills/experiment-contract/SKILL.md",
    "resources/skills/experiment-contract/references/*.md",
    "resources/schemas/*.json",
    "resources/templates/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
