name: Publish release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    if: github.repository == 'Gramathon/expcon'
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Authorised source history before executing release tooling
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$ ]]
          git merge-base --is-ancestor HEAD origin/main
          test "$(git rev-parse "$TAG^{commit}")" = "$(git rev-parse HEAD)"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python -B tools/release/version.py --tag "$TAG" > version.json
          python -c 'import json,os; v=json.load(open("version.json")); open(os.environ["GITHUB_OUTPUT"],"a").write("prerelease="+str(v["prerelease"]).lower()+"\n")'
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  python:
    needs: source
    uses: ./.github/workflows/ci.yml
  integrity:
    needs: source
    uses: ./.github/workflows/research-integrity.yml
  packages:
    needs: source
    uses: ./.github/workflows/release-validation.yml
  assemble:
    needs: [source, python, integrity, packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: evidence
      - name: Assemble exact validated binaries and reports
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir release
          cp evidence/package-3.12/*.whl evidence/package-3.12/*.tar.gz evidence/pi-package/*.tgz release/
          python -B tools/release/manifest.py release evidence --tag "$TAG"
          (cd release && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sealed-release
          path: release/*
          if-no-files-found: error
          retention-days: 14
  provenance:
    needs: assemble
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sealed-release
          path: release
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: release/*
  publish:
    needs: [source, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: read
    steps:
      # No source checkout or repository scripts run with publication credentials.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sealed-release
          path: release
      - name: Verify checksums, provenance and immutable release policy
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          (cd release && sha256sum --check SHA256SUMS)
          for asset in release/*; do
            gh attestation verify "$asset" --repo "$GH_REPO" --signer-workflow "$GH_REPO/.github/workflows/publish-release.yml"
          done
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace any assets." >&2
            exit 1
          fi
      - name: Create draft with validated assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.source.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$TAG" --verify-tag --draft --title "Expcon $TAG" --notes-file release/release-notes.md "${flags[@]}" release/*
          gh release edit "$TAG" --draft=false
