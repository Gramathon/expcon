name: Release validation
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  UV_NO_PROGRESS: "1"
jobs:
  build:
    name: Build immutable Python distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.5"
      - name: Build wheel from source distribution
        run: |
          uv build --sdist --out-dir "$RUNNER_TEMP/dist"
          uv build "$RUNNER_TEMP"/dist/*.tar.gz --wheel --out-dir "$RUNNER_TEMP/dist"
          python -B tools/check_distribution.py "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-dist
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
  package:
    needs: build
    name: Package Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.5"
          enable-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-dist
          path: ${{ runner.temp }}/dist
      - name: Runtime-only installation away from the checkout
        run: |
          python -B tools/validation/check_installation.py --wheel "$RUNNER_TEMP"/dist/*.whl --interpreter "${{ matrix.python }}=$(command -v python)" --report "$RUNNER_TEMP/package-report.json"
      - name: Upload validated package and installation diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/dist/*.whl
            ${{ runner.temp }}/dist/*.tar.gz
            ${{ runner.temp }}/package-report.json
          retention-days: 7
          if-no-files-found: warn

  pi-package:
    name: Pi package and installed MCP lifecycle
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.5"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.5"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: package-3.12
          path: ${{ runner.temp }}/python-package
      - name: Locked TypeScript checks, unit tests and package build
        working-directory: integrations/pi-expcon
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm test
          mkdir -p "$RUNNER_TEMP/pi-artifacts"
          npm pack --pack-destination "$RUNNER_TEMP/pi-artifacts"
      - name: Verify Pi distribution and version agreement
        run: |
          python -B tools/release/version.py
          python -B tools/release/check_pi.py "$RUNNER_TEMP"/pi-artifacts/*.tgz
      - name: Install the built wheel outside the checkout
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/controller"
          uv pip install --python "$RUNNER_TEMP/controller/bin/python" "$(echo "$RUNNER_TEMP"/python-package/*.whl)[mcp]"
          "$RUNNER_TEMP/controller/bin/python" -I tools/validation/prepare_installed_cpu.py "$RUNNER_TEMP/research"
          mkdir -p "$RUNNER_TEMP/pi-extracted"
          tar -xzf "$RUNNER_TEMP"/pi-artifacts/*.tgz -C "$RUNNER_TEMP/pi-extracted"
      - name: Installed Pi, packaged skill, MCP, CPU outcomes, corruption and reconnect
        env:
          EXPCON_MCP_EXECUTABLE: ${{ runner.temp }}/controller/bin/expcon-mcp
          EXPCON_EXECUTABLE: ${{ runner.temp }}/controller/bin/expcon
        run: |
          node integrations/pi-expcon/tests/installed.mjs "$RUNNER_TEMP/pi-extracted/package" "$RUNNER_TEMP/research" "$RUNNER_TEMP/pi-artifacts/pi-integration.json"
      - name: Fetch pinned SoL-Pi compatibility fixture
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: NVlabs/SoL-Pi
          ref: 219568034fa54ed121ede80961655e33dfb9d0e3
          path: .test-sol-pi
          persist-credentials: false
      - name: SoL-Pi package with installed controller
        env:
          EXPCON_TEST_CONFIGURED_MCP: "1"
          EXPCON_MCP_EXECUTABLE: ${{ runner.temp }}/controller/bin/expcon-mcp
          EXPCON_EXECUTABLE: ${{ runner.temp }}/controller/bin/expcon
        run: |
          "$RUNNER_TEMP/controller/bin/python" -I tools/validation/prepare_installed_cpu.py "$RUNNER_TEMP/sol-research"
          SOL_PI_PACKAGE="$PWD/.test-sol-pi" node integrations/pi-expcon/tests/installed.mjs "$RUNNER_TEMP/pi-extracted/package" "$RUNNER_TEMP/sol-research" "$RUNNER_TEMP/pi-artifacts/sol-pi-integration.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pi-package
          path: ${{ runner.temp }}/pi-artifacts/*
          if-no-files-found: error
          retention-days: 7
