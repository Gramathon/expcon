name: Release validation
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*", "rc-*"]
permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  UV_NO_PROGRESS: "1"
jobs:
  package:
    name: Package Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.5"
          enable-cache: false
      - name: Build wheel from source distribution
        run: |
          uv build --sdist --out-dir "$RUNNER_TEMP/dist"
          uv build "$RUNNER_TEMP"/dist/*.tar.gz --wheel --out-dir "$RUNNER_TEMP/dist"
          python -B tools/check_distribution.py "$RUNNER_TEMP/dist"
      - name: Runtime-only installation away from the checkout
        run: |
          python -B tools/validation/check_installation.py --wheel "$RUNNER_TEMP"/dist/*.whl --interpreter "${{ matrix.python }}=$(command -v python)" --report "$RUNNER_TEMP/package-report.json"
      - name: Upload validated package and installation diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/dist/*.whl
            ${{ runner.temp }}/dist/*.tar.gz
            ${{ runner.temp }}/package-report.json
          retention-days: 7
          if-no-files-found: warn
